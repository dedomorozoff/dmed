name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  publish:
    name: build + publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        run: make dist VERSION=${GITHUB_REF_NAME#v}

      - name: Build Windows zip
        run: make win-zip VERSION=${GITHUB_REF_NAME#v}

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build .deb package
        run: make deb VERSION=${GITHUB_REF_NAME#v}

      - name: Build .rpm package
        run: make rpm VERSION=${GITHUB_REF_NAME#v}

      - name: Build Termux .deb
        run: make termux VERSION=${GITHUB_REF_NAME#v}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dmed-*
            dist/*.zip
            dist/*.deb
            dist/rpm/RPMS/x86_64/*.rpm
          generate_release_notes: true